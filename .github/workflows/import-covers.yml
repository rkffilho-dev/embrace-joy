name: Import category covers

on:
  push:
    branches:
      - upload-category-covers-20260929

permissions:
  contents: write

jobs:
  import-covers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: upload-category-covers-20260929
          fetch-depth: 0

      - name: Rebuild archive and extract covers
        shell: bash
        run: |
          set -euo pipefail
          cat .cover-import/chunk-*.txt > /tmp/covers.b64
          base64 -d /tmp/covers.b64 > /tmp/covers.zip
          unzip -o /tmp/covers.zip -d .
          rm -rf .cover-import
          rm -f .github/workflows/import-covers.yml

      - name: Commit imported covers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add categorized magazine covers from uploaded ZIP"
          git push origin HEAD:upload-category-covers-20260929
