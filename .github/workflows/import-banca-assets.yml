name: Import Banca Retro assets

on:
  push:
    branches:
      - upload-banca-assets-20260930

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: upload-banca-assets-20260930
          fetch-depth: 0

      - name: Rebuild archive and extract assets
        shell: bash
        run: |
          set -euo pipefail
          cat .asset-import/chunk-*.txt > /tmp/banca-assets.b64
          base64 -d /tmp/banca-assets.b64 > /tmp/banca-assets.zip
          unzip -o /tmp/banca-assets.zip -d .
          rm -rf .asset-import
          rm -f .github/workflows/import-banca-assets.yml

      - name: Commit imported assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Banca Retro offer and bonus assets"
          git push origin HEAD:upload-banca-assets-20260930
