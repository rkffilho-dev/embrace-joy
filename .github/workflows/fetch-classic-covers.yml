name: Fetch classic magazine covers

on:
  workflow_dispatch:
  push:
    branches:
      - classic-magazine-covers
    paths:
      - ".github/workflows/fetch-classic-covers.yml"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: classic-magazine-covers

      - name: Download covers
        shell: bash
        run: |
          set -e
          mkdir -p src/assets/covers

          curl -L --fail --retry 3 -A "Mozilla/5.0"             "https://1.bp.blogspot.com/-imx2P3YSSL4/YQM3cvnHBBI/AAAAAAAAU3g/uePRYS4jKMkXJw7sP8sxpu7zKTNBpuXiQCLcBGAsYHQ/s797/acao_games_111_capa.jpeg"             -o src/assets/covers/acao-games-111.jpg

          curl -L --fail --retry 3 -A "Mozilla/5.0"             "https://imortaisdofutebol.com/wp-content/uploads/2019/07/revista-placar-copa-do-mundo-1994-n-5-brasil-3-x-2-holanda-e1562328545476.jpg"             -o src/assets/covers/placar-1994.jpg

          curl -L --fail --retry 3 -A "Mozilla/5.0"             "https://boxloja-std-cdn-r2.minhaboxloja.com/lojas/sa10y/produtos/cc6cdb7b-7026-49ed-894c-feb62821220d.png"             -o src/assets/covers/quatro-rodas-1988.png

          curl -L --fail --retry 3 -A "Mozilla/5.0"             "https://photos.enjoei.com.br/revista-super-interessante-setembro-1996-tunel-do-tempo/1200xN/czM6Ly9waG90b3MuZW5qb2VpLmNvbS5ici9wcm9kdWN0cy80MDcyMDAvMWIzOTQ2NmM3NmVhMjBiYWE2ZTQ2YTNjZmQ0ZDBjM2IuanBn"             -o src/assets/covers/superinteressante-1996.jpg

          curl -L --fail --retry 3 -A "Mozilla/5.0"             "https://4.bp.blogspot.com/-08CN4w7EOKc/UakzxygixzI/AAAAAAAANCY/F1SDuly7efI/s1600/digitalizar0001%2B%281%29.jpg"             -o src/assets/covers/bizz-1986.jpg

          curl -L --fail --retry 3 -A "Mozilla/5.0"             "https://down-br.img.susercontent.com/file/br-11134207-7r98o-lklnd73yb97s1c"             -o src/assets/covers/revista-xuxa-1988.jpg

          curl -L --fail --retry 3 -A "Mozilla/5.0"             "https://jannarevistas.com.br/cdn/shop/files/rn-image_picker_lib_temp_1689206d-5eef-4280-b0c0-60c12a79be97.jpg?v=1752147789"             -o src/assets/covers/mad-52.jpg

          curl -L --fail --retry 3 -A "Mozilla/5.0"             "https://imgv2-2-f.scribdassets.com/img/document/223062656/original/375d6a964a/1?v=1"             -o src/assets/covers/mundo-estranho-71.jpg || true

          curl -L --fail --retry 3 -A "Mozilla/5.0"             "https://imgv2-1-f.scribdassets.com/img/document/764908092/original/bf2ef9ed0e/1?v=1"             -o src/assets/covers/recreio-247.jpg || true

          # Remove empty/HTML error files
          find src/assets/covers -type f -size -5k -delete

      - name: Commit downloaded assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/assets/covers
          if git diff --cached --quiet; then
            echo "No new covers downloaded."
            exit 0
          fi
          git commit -m "Add classic magazine cover assets"
          git push origin HEAD:classic-magazine-covers
