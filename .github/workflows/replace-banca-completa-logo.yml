name: Replace Banca Completa logo with transparent version

on:
  push:
    branches:
      - fix-transparent-banca-logo-20261006

permissions:
  contents: write

jobs:
  replace-logo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix-transparent-banca-logo-20261006
          fetch-depth: 0

      - name: Decode transparent logo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/assets/banca-retro
          base64 -d .asset-import/logo-banca-completa-quiosque-replace.b64.txt > public/assets/banca-retro/logo-banca-completa-quiosque.webp
          rm -rf .asset-import
          rm -f .github/workflows/replace-banca-completa-logo.yml

      - name: Commit replacement
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace Banca Completa logo with transparent background"
          git push origin HEAD:fix-transparent-banca-logo-20261006
