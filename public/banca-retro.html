<!doctype html>
<html lang="pt-BR">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#102d38">

<title>Banca Retrô Digital</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Anton&family=DM+Sans:wght@400;500;600;700;800;900&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

<style>

/* =========================================================
   CONFIGURAÇÕES
========================================================= */

:root{

  --paper:#f5ead3;
  --paper2:#ead8b8;

  --ink:#17120d;

  --red:#d92d20;
  --red-dark:#a91e17;

  --yellow:#ffc928;
  --orange:#f07a24;

  --blue:#173d4c;
  --blue-mid:#123441;
  --blue-dark:#081b24;

  --green:#18b45b;
  --green-dark:#08743a;

  --gold:#e9b93f;
  --gold2:#ffdc72;

  --white:#fffdf8;
  --gray:#b6bec1;

}


/* =========================================================
   RESET
========================================================= */

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
  width:100%;
  overflow-x:hidden;
}

body{

  margin:0;
  padding:0;

  width:100%;
  min-height:100%;

  overflow-x:hidden;

  background:#102d38;

  color:var(--ink);

  font-family:"DM Sans",sans-serif;

}

img{
  max-width:100%;
  display:block;
}

a{
  color:inherit;
}

button{
  font-family:inherit;
}

.container{

  width:min(1160px, calc(100% - 32px));

  margin-left:auto;
  margin-right:auto;

}

.center{
  text-align:center;
}


/* =========================================================
   BARRA SUPERIOR
========================================================= */

.alert-bar{

  width:100%;

  background:var(--red);

  color:white;

  text-align:center;

  font-size:12px;
  font-weight:900;

  padding:9px 12px;

  letter-spacing:.3px;

  text-transform:uppercase;

}


/* =========================================================
   TICKER
========================================================= */

.ticker{

  width:100%;

  overflow:hidden;

  white-space:nowrap;

  background:var(--yellow);

  color:#211700;

  border-bottom:3px solid #101010;

  font-weight:900;

  font-size:11px;

}

.ticker-track{

  display:flex;

  width:max-content;

  animation:tickerMove 26s linear infinite;

}

.ticker-track span{

  padding:8px 30px;

}

@keyframes tickerMove{

  from{
    transform:translateX(0);
  }

  to{
    transform:translateX(-50%);
  }

}


/* =========================================================
   HERO
========================================================= */

.hero{

  width:100%;

  position:relative;

  overflow:hidden;

  padding:45px 0 70px;

  color:white;

  background:

    radial-gradient(
      circle at 50% -10%,
      #28667b 0%,
      #194453 35%,
      #0b2530 68%,
      #071a22 100%
    );

}

.hero:after{

  content:"";

  position:absolute;

  bottom:0;
  left:0;

  width:100%;
  height:7px;

  background:
    repeating-linear-gradient(
      90deg,
      var(--red) 0 100px,
      var(--yellow) 100px 200px,
      #eee0bd 200px 300px
    );

}


.eyebrow{

  display:inline-flex;

  align-items:center;
  justify-content:center;

  padding:7px 14px;

  border-radius:100px;

  border:1px solid rgba(255,255,255,.22);

  background:rgba(255,255,255,.07);

  color:#e6eef0;

  font-size:11px;
  font-weight:900;

  text-transform:uppercase;

}


/* LOGO PRINCIPAL — BANCA COMPLETA */
.hero-brand-logo{
  width:min(720px,92vw);
  height:auto;
  margin:0 auto 18px;
  display:block;
  object-fit:contain;
  filter:drop-shadow(0 14px 28px rgba(0,0,0,.30));
}


.hero h1{

  max-width:920px;

  margin:20px auto 18px;

  font-family:"Anton",sans-serif;

  font-size:clamp(43px,7vw,82px);

  font-weight:400;

  line-height:.94;

  letter-spacing:.3px;

  text-transform:uppercase;

}


.hero h1 span{

  display:inline;

  color:var(--yellow);

  text-shadow:
    3px 3px 0 var(--red);

}


.hero-sub{

  max-width:720px;

  margin:0 auto;

  color:#e0eaed;

  font-size:17px;

  line-height:1.6;

}


/* =========================================================
   VIDEO HERO
========================================================= */

.video-wrap{

  position:relative;

  width:min(390px, 92%);

  aspect-ratio:9/16;

  margin:35px auto 28px;

  overflow:hidden;

  border-radius:17px;

  border:4px solid var(--yellow);

  outline:4px solid var(--red);

  background:#07151b;

  box-shadow:
    0 25px 65px rgba(0,0,0,.48);

}

.video-wrap video{

  width:100%;
  height:100%;

  object-fit:cover;

}

.video-placeholder{

  position:absolute;

  inset:0;

  display:flex;

  align-items:center;
  justify-content:center;

  text-align:center;

  padding:30px;

  background:
    radial-gradient(
      circle at 50% 25%,
      #214b5a,
      #07171e 75%
    );

}

.play{

  width:75px;
  height:75px;

  margin:0 auto 17px;

  display:grid;
  place-items:center;

  border-radius:50%;

  background:var(--red);

  color:white;

  font-size:30px;

  box-shadow:
    0 0 0 10px rgba(255,255,255,.06);

}


/* =========================================================
   BOTÕES
========================================================= */

.cta{

  display:inline-flex;

  align-items:center;
  justify-content:center;

  min-height:56px;

  padding:15px 30px;

  border:0;

  border-radius:8px;

  cursor:pointer;

  text-decoration:none;

  text-align:center;

  font-size:16px;
  font-weight:1000;

  text-transform:uppercase;

  color:#201500;

  background:
    linear-gradient(
      180deg,
      #ffe77a,
      #ffc400
    );

  box-shadow:
    0 6px 0 #a86600,
    0 15px 30px rgba(0,0,0,.28);

  transition:
    transform .2s,
    filter .2s;

}

.cta:hover{

  transform:translateY(-3px);

  filter:brightness(1.05);

}


.cta-green{

  color:white;

  background:
    linear-gradient(
      180deg,
      #35db78,
      #12a650
    );

  box-shadow:
    0 6px 0 #087136,
    0 15px 30px rgba(0,0,0,.28);

}


.cta-white{

  background:white;

  color:#111;

  box-shadow:
    0 6px 0 #a9a9a9,
    0 15px 30px rgba(0,0,0,.24);

}


.hero-note{

  margin-top:17px;

  color:#aebfc5;

  font-size:12px;

}


/* =========================================================
   ESTEIRA
========================================================= */

.cover-showcase{

  width:100%;

  padding:35px 0;

  overflow:hidden;

  background:#16110d;

}

.cover-track{

  display:flex;

  width:max-content;

  gap:15px;

  animation:none;
  will-change:transform;

}

.cover{

  flex:none;

  width:155px;

  aspect-ratio:3/4;

  overflow:hidden;

  background:#29231d;

  border:3px solid #eadbb7;

  box-shadow:
    0 13px 22px rgba(0,0,0,.4);

}

.cover img{

  width:100%;
  height:100%;

  object-fit:cover;

}

.cover-placeholder{

  width:100%;
  height:100%;

  display:grid;
  place-items:center;

  padding:15px;

  color:#c8bda9;

  text-align:center;

  font-size:11px;

  background:
    linear-gradient(
      145deg,
      #74452e,
      #28221d
    );

}

@keyframes coverMove{

  from{
    transform:translate3d(0,0,0);
  }

  to{
    transform:translate3d(calc(-50% - 7.5px),0,0);
  }

}

@keyframes coverMoveReverse{

  from{
    transform:translate3d(calc(-50% - 7.5px),0,0);
  }

  to{
    transform:translate3d(0,0,0);
  }

}


/* =========================================================
   TÍTULOS
========================================================= */

.kicker{

  color:var(--red);

  text-align:center;

  text-transform:uppercase;

  font-size:12px;
  font-weight:1000;

  letter-spacing:1px;

}

.section-title{

  max-width:850px;

  margin:10px auto 18px;

  font-family:"Anton",sans-serif;

  font-size:clamp(37px,5vw,60px);

  font-weight:400;

  line-height:1;

  text-align:center;

  text-transform:uppercase;

}

.section-copy{

  max-width:760px;

  margin:0 auto;

  color:#574e42;

  font-family:"Libre Baskerville",serif;

  font-size:16px;

  line-height:1.75;

  text-align:center;

}


/* =========================================================
   INTRO
========================================================= */

.intro{

  width:100%;

  padding:75px 0;

  background:var(--paper);

}


/* =========================================================
   MOCKUP BANCA
========================================================= */

.device-area{

  max-width:900px;

  margin:45px auto 0;

}

.browser{

  overflow:hidden;

  border:7px solid #29241e;

  border-radius:15px;

  background:#101010;

  box-shadow:
    0 25px 55px rgba(39,25,8,.23);

}

.browser-top{

  display:flex;

  gap:7px;

  padding:11px;

  background:#37312b;

}

.browser-top i{

  width:10px;
  height:10px;

  border-radius:50%;

  background:#c7bba8;

}

.library{

  padding:28px;

  background:#101a1e;

}

.library-title{

  margin-bottom:20px;

  color:white;

  font-size:23px;
  font-weight:900;

}

.library-grid{

  display:grid;

  grid-template-columns:
    repeat(5,1fr);

  gap:12px;

}

.library-cover{

  position:relative;

  overflow:hidden;

  aspect-ratio:3/4;

  border-radius:4px;

  background:
    linear-gradient(
      145deg,
      #d0ae7e,
      #5c3626
    );

}

.library-cover:after{

  content:"CAPA";

  position:absolute;

  inset:0;

  display:grid;
  place-items:center;

  color:rgba(255,255,255,.7);

  font-family:"Anton";
  font-size:18px;

}


/* =========================================================
   BENEFÍCIOS
========================================================= */

.benefits{

  width:100%;

  padding:65px 0;

  background:#fff9ec;

}

.benefit-grid{

  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:18px;

  margin-top:38px;

}

.benefit{

  padding:27px 22px;

  text-align:center;

  background:white;

  border:1px solid #d5c3a0;

  box-shadow:
    5px 5px 0 #e0cfac;

}

.benefit-icon{

  font-size:32px;

}

.benefit h3{

  margin:12px 0 7px;

  font-size:16px;

}

.benefit p{

  margin:0;

  color:#70675c;

  font-size:13px;

  line-height:1.55;

}


/* =========================================================
   CATEGORIAS
========================================================= */

.categories{

  width:100%;

  padding:75px 0;

  color:white;

  background:
    linear-gradient(
      180deg,
      #102e3a,
      #071a22
    );

}

.category-cloud{

  max-width:920px;

  margin:35px auto;

  display:flex;

  flex-wrap:wrap;

  justify-content:center;

  gap:9px;

}

.category-cloud span{

  padding:9px 14px;

  border-radius:100px;

  border:1px solid #456773;

  background:#163846;

  color:#dce7ea;

  font-size:12px;

}


/* =========================================================
   MEMÓRIA
========================================================= */

.memory{

  width:100%;

  padding:75px 0;

  background:var(--paper);

}

.memory-box{

  display:grid;

  grid-template-columns:1fr 1fr;

  overflow:hidden;

  background:var(--red);

  color:white;

  box-shadow:
    10px 10px 0 #bfa77d;

}

.memory-image{

  min-height:420px;

  display:grid;
  place-items:center;

  padding:35px;

  text-align:center;

  background:
    radial-gradient(
      circle,
      #504337,
      #201a15
    );

}

.memory-copy{

  display:flex;

  flex-direction:column;
  justify-content:center;

  padding:50px;

}

.memory-copy h2{

  margin:0 0 18px;

  font-family:"Anton";

  font-size:46px;
